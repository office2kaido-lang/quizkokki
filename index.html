<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>せかいの こっき と しゅと クイズ ver00006</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
      background: linear-gradient(135deg, #a5f3fc, #dbeafe);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 850px;
      background: white;
      display: flex;
      flex-direction: column;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    header {
      background: #4f46e5;
      color: white;
      text-align: center;
      padding: 12px;
      font-size: 20px;
      font-weight: bold;
    }
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #e0f7fa, #fff); 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
      padding: 20px;
      color: #333;
    }
    .title-helper {
      font-size: 14px;
      color: #777;
      margin-bottom: -10px;
    }
    .cover-title {
      font-size: 28px;
      font-weight: 900;
      text-align: center;
      line-height: 1.3;
      margin-bottom: 20px;
    }
    .cover-title .p1 { color: #ec4899; }
    .cover-title .p2 { color: #f59e0b; }
    .cover-title .p3 { color: #10b981; }
    .cover-title .p4 { color: #3b82f6; }
    
    .version {
      font-size: 12px;
      color: #aaa;
      margin-top: -10px;
      margin-bottom: 20px;
    }

    .diff-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    .diff-title {
      font-size: 18px;
      font-weight: bold;
      background: #e0f2fe;
      color: #0369a1;
      padding: 8px 24px;
      border-radius: 20px;
    }
    .diff-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 100%;
      max-width: 360px;
    }
    .diff-btn {
      background: #ffffff;
      color: #0369a1;
      border: 4px solid #bae6fd;
      padding: 15px 0;
      font-size: 20px;
      font-weight: bold;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: all 0.1s;
    }
    .diff-btn.active {
      background: #facc15;
      color: #713f12;
      border-color: #facc15;
      transform: scale(1.05);
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    }
    .btn-go {
      background: #ef4444;
      color: white;
      font-size: 56px;
      font-weight: 900;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 8px solid #fff;
      box-shadow: 0 10px 0 #b91c1c;
      cursor: pointer;
      opacity: 0.5;
      pointer-events: none;
      transition: all 0.2s;
    }
    .btn-go.ready {
      opacity: 1;
      pointer-events: auto;
    }
    .btn-go:not(:disabled):active {
      transform: translateY(6px);
      box-shadow: 0 4px 0 #b91c1c;
    }
    
    .instruction {
      font-size: 14px;
      color: #333;
      margin-top: 10px;
      text-align: center;
    }
    
    #quiz-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
      gap: 10px;
    }
    .flag-card {
      width: 100%;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      border: 4px solid #e2e8f0;
      border-radius: 12px;
      padding: 8px;
    }
    .flag-card img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .symbol-box {
      font-size: 72px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .english-box {
      font-size: 20px;
      font-weight: 800;
      color: #1e3a8a;
      background: #e0f2fe;
      border: 3px solid #bae6fd;
      padding: 6px 20px;
      border-radius: 30px;
      text-align: center;
      min-height: 38px;
    }
    .button-group {
      width: 100%;
      display: flex;
      gap: 20px;
      margin-top: 15px;
      margin-bottom: 10px;
    }
    .btn-ans {
      flex: 1;
      height: 130px;
      border: none;
      border-radius: 20px;
      font-size: 80px;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }
    .btn-ans:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .btn-maru {
      background: #22c55e;
      box-shadow: 0 10px 0 #15803d;
    }
    .btn-maru:not(:disabled):active {
      transform: translateY(5px);
      box-shadow: 0 5px 0 #15803d;
    }
    .btn-batsu {
      background: #ef4444;
      box-shadow: 0 10px 0 #b91c1c;
    }
    .btn-batsu:not(:disabled):active {
      transform: translateY(5px);
      box-shadow: 0 5px 0 #b91c1c;
    }
    .status-box {
      font-size: 18px;
      font-weight: bold;
      color: #475569;
      height: 28px;
      margin-top: 5px;
    }
    #line-notice {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      color: white;
      z-index: 200;
      padding: 30px;
      text-align: center;
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div id="app-container">
  <div id="line-notice">
    ⚠️ 音を鳴らすため、画面右上の「…」を押して「Safari（またはChrome）で開く」を選んでね！
  </div>

  <header>せかいの こっき & しゅと クイズ ver00006</header>

  <div id="start-screen">
    <div class="title-helper">ひらがな カタカナ</div>
    <h1 class="cover-title">
      <span class="p1">せ</span><span class="p2">か</span><span class="p1">い</span><span class="p2">の</span>
      <span class="p3">こ</span><span class="p4">っ</span><span class="p3">き</span><br>
      <span class="p1">&</span> <span class="p2">し</span><span class="p1">ゅ</span><span class="p2">と</span>
      <span class="p3">ク</span><span class="p4">イ</span><span class="p3">ズ</span>
    </h1>
    <div class="version">ver00006</div>
    
    <div class="diff-container">
      <div class="diff-title">むずかしさを えらんでね</div>
      <div class="diff-grid">
        <button class="diff-btn" onclick="selectDifficulty('easy', this)">かんたん ☀️</button>
        <button class="diff-btn" onclick="selectDifficulty('normal', this)">ふつう ☁️</button>
        <button class="diff-btn" onclick="selectDifficulty('hard', this)">むずかしい 🌋</button>
        <button class="diff-btn" onclick="selectDifficulty('expert', this)">ちょう難問 ⚡️</button>
      </div>
    </div>

    <button id="go-btn" class="btn-go" onclick="startGame()">GO</button>
    
    <div class="instruction">
      黒い3点をタップし、デフォルトのブラウザで開くをタップして下さい。
    </div>
  </div>

  <div id="quiz-screen">
    <div class="flag-card"><img id="flag-img" src="" alt="国旗"></div>
    <div class="symbol-box" id="symbol-emoji">🌸</div>
    <div class="english-box" id="english-text">Japan / Tokyo</div>

    <div class="button-group">
      <button id="btn-maru" class="btn-ans btn-maru" onclick="checkAnswer(true)">〇</button>
      <button id="btn-batsu" class="btn-ans btn-batsu" onclick="checkAnswer(false)">✕</button>
    </div>

    <div class="status-box" id="status-text">👉 〇 か ✕ を おしてね！</div>
  </div>
</div>

<script>
if (navigator.userAgent.indexOf('LINE') !== -1) {
  document.getElementById('line-notice').style.display = 'block';
}

const allCountries = [
  // かんたん (10カ国)
  { code: "jp", country: "日本", capital: "東京", enText: "Japan / Tokyo", emoji: "🌸", level: 1 },
  { code: "us", country: "アメリカ", capital: "ワシントン", enText: "USA / Washington", emoji: "🗽", level: 1 },
  { code: "gb", country: "イギリス", capital: "ロンドン", enText: "UK / London", emoji: "👑", level: 1 },
  { code: "fr", country: "フランス", capital: "パリ", enText: "France / Paris", emoji: "🗼", level: 1 },
  { code: "de", country: "ドイツ", capital: "ベルリン", enText: "Germany / Berlin", emoji: "🏰", level: 1 },
  { code: "it", country: "イタリア", capital: "ローマ", enText: "Italy / Rome", emoji: "🍕", level: 1 },
  { code: "cn", country: "中国", capital: "北京", enText: "China / Beijing", emoji: "🐼", level: 1 },
  { code: "kr", country: "韓国", capital: "ソウル", enText: "South Korea / Seoul", emoji: "🍱", level: 1 },
  { code: "ca", country: "カナダ", capital: "オタワ", enText: "Canada / Ottawa", emoji: "🍁", level: 1 },
  { code: "au", country: "オーストラリア", capital: "キャンベラ", enText: "Australia / Canberra", emoji: "🐨", level: 1 },

  // ふつう (追加10カ国)
  { code: "br", country: "ブラジル", capital: "ブラジリア", enText: "Brazil / Brasilia", emoji: "⚽", level: 2 },
  { code: "eg", country: "エジプト", capital: "カイロ", enText: "Egypt / Cairo", emoji: "🐪", level: 2 },
  { code: "in", country: "インド", capital: "ニューデリー", enText: "India / New Delhi", emoji: "🐘", level: 2 },
  { code: "es", country: "スペイン", capital: "マドリード", enText: "Spain / Madrid", emoji: "💃", level: 2 },
  { code: "sg", country: "シンガポール", capital: "シンガポール", enText: "Singapore / Singapore", emoji: "🦁", level: 2 },
  { code: "th", country: "タイ", capital: "バンコク", enText: "Thailand / Bangkok", emoji: "🐘", level: 2 },
  { code: "vn", country: "ベトナム", capital: "ハノイ", enText: "Vietnam / Hanoi", emoji: "🍜", level: 2 },
  { code: "mx", country: "メキシコ", capital: "メキシコシティ", enText: "Mexico / Mexico City", emoji: "🌮", level: 2 },
  { code: "ru", country: "ロシア", capital: "モスクワ", enText: "Russia / Moscow", emoji: "🪆", level: 2 },
  { code: "ar", country: "アルゼンチン", capital: "ブエノスアイレス", enText: "Argentina / Buenos Aires", emoji: "🥩", level: 2 },

  // むずかしい (追加10カ国)
  { code: "za", country: "南アフリカ", capital: "プレトリア", enText: "South Africa / Pretoria", emoji: "🦁", level: 3 },
  { code: "nl", country: "オランダ", capital: "アムステルダム", enText: "Netherlands / Amsterdam", emoji: "🌷", level: 3 },
  { code: "ch", country: "スイス", capital: "ベルン", enText: "Switzerland / Bern", emoji: "🧀", level: 3 },
  { code: "se", country: "スウェーデン", capital: "ストックホルム", enText: "Sweden / Stockholm", emoji: "🌲", level: 3 },
  { code: "gr", country: "ギリシャ", capital: "アテネ", enText: "Greece / Athens", emoji: "🏛️", level: 3 },
  { code: "tr", country: "トルコ", capital: "アンカラ", enText: "Turkey / Ankara", emoji: "🥙", level: 3 },
  { code: "nz", country: "ニュージーランド", capital: "ウェリントン", enText: "New Zealand / Wellington", emoji: "🥝", level: 3 },
  { code: "ph", country: "フィリピン", capital: "マニラ", enText: "Philippines / Manila", emoji: "🥭", level: 3 },
  { code: "id", country: "インドネシア", capital: "ジャカルタ", enText: "Indonesia / Jakarta", emoji: "🏝️", level: 3 },
  { code: "pe", country: "ペルー", capital: "リマ", enText: "Peru / Lima", emoji: "🦙", level: 3 },

  // ちょう難問 (追加10カ国)
  { code: "mn", country: "モンゴル", capital: "ウランバートル", enText: "Mongolia / Ulaanbaatar", emoji: "🐎", level: 4 },
  { code: "ke", country: "ケニア", capital: "ナイロビ", enText: "Kenya / Nairobi", emoji: "🦒", level: 4 },
  { code: "fi", country: "フィンランド", capital: "ヘルシンキ", enText: "Finland / Helsinki", emoji: "🎅", level: 4 },
  { code: "pl", country: "ポーランド", capital: "ワルシャワ", enText: "Poland / Warsaw", emoji: "🥟", level: 4 },
  { code: "pt", country: "ポルトガル", capital: "リスボン", enText: "Portugal / Lisbon", emoji: "⛵", level: 4 },
  { code: "cl", country: "チリ", capital: "サンティアゴ", enText: "Chile / Santiago", emoji: "🏔️", level: 4 },
  { code: "co", country: "コロンビア", capital: "ボゴタ", enText: "Colombia / Bogota", emoji: "☕", level: 4 },
  { code: "my", country: "マレーシア", capital: "クアラルンプール", enText: "Malaysia / Kuala Lumpur", emoji: "🏙️", level: 4 },
  { code: "sa", country: "サウジアラビア", capital: "リヤド", enText: "Saudi Arabia / Riyadh", emoji: "🌴", level: 4 },
  { code: "is", country: "アイスランド", capital: "レイキャビク", enText: "Iceland / Reykjavik", emoji: "🌋", level: 4 }
];

let selectedLevel = null;
let currentCountries = [];
let countryHistory = []; 
let consecutiveCount = 0;
let lastTypeIsCorrect = null;
let currentQuestion = null;
let isAnswerable = false;
let audioCtx = null;

const mapBtns = document.querySelectorAll('.diff-btn');
const goBtn = document.getElementById('go-btn');
const flagImg = document.getElementById('flag-img');
const symbolEmoji = document.getElementById('symbol-emoji');
const englishText = document.getElementById('english-text');
const statusText = document.getElementById('status-text');
const maruBtn = document.getElementById('btn-maru');
const batsuBtn = document.getElementById('btn-batsu');

function setButtonsEnabled(enabled) {
  isAnswerable = enabled;
  maruBtn.disabled = !enabled;
  batsuBtn.disabled = !enabled;
}

function selectDifficulty(diff, btn) {
  selectedLevel = diff;
  localStorage.setItem('quiz_kokki_diff', diff);

  mapBtns.forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  goBtn.classList.add('ready');

  let maxLevel = 1;
  if (diff === 'easy') maxLevel = 1;
  else if (diff === 'normal') maxLevel = 2;
  else if (diff === 'hard') maxLevel = 3;
  else if (diff === 'expert') maxLevel = 4;

  currentCountries = allCountries.filter(c => c.level <= maxLevel);
  countryHistory = []; 
}

window.onload = function() {
  const saved = localStorage.getItem('quiz_kokki_diff');
  if (saved) {
    const map = { 'easy': 0, 'normal': 1, 'hard': 2, 'expert': 3 };
    if (mapBtns[map[saved]]) {
      selectDifficulty(saved, mapBtns[map[saved]]);
    }
  }
};

function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880.00, now);
      osc.frequency.setValueAtTime(1174.66, now + 0.12);
      gain.gain.setValueAtTime(1.0, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
      osc.start(now);
      osc.stop(now + 0.6);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.setValueAtTime(140, now + 0.15);
      gain.gain.setValueAtTime(1.0, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
      osc.start(now);
      osc.stop(now + 0.6);
    }
  } catch(e) {}
}

function startGame() {
  if (!selectedLevel) return;
  document.getElementById('start-screen').style.display = 'none';
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  nextQuestion();
}

function getRandomFlagCountry() {
  // 履歴の最大保持数を動的に算出（基本20問、登録数が少ない場合は 全体数 - 1）
  const maxHistory = Math.min(20, Math.max(1, currentCountries.length - 1));

  let available = currentCountries.filter(c => !countryHistory.includes(c.code));
  if (available.length === 0) {
    available = currentCountries;
    countryHistory = [];
  }
  
  const selected = available[Math.floor(Math.random() * available.length)];
  
  countryHistory.push(selected.code);
  if (countryHistory.length > maxHistory) {
    countryHistory.shift(); 
  }
  
  return selected;
}

function getRandomSpeechCountry(targetCode, isCorrectPair) {
  if (isCorrectPair) {
    return currentCountries.find(c => c.code === targetCode);
  } else {
    let available = currentCountries.filter(c => c.code !== targetCode);
    return available[Math.floor(Math.random() * available.length)];
  }
}

function nextQuestion() {
  setButtonsEnabled(true); 
  statusText.innerText = "👉 〇 か ✕ を おしてね！";

  const targetCountry = getRandomFlagCountry();
  let isCorrectPair = (consecutiveCount >= 3) ? !lastTypeIsCorrect : (Math.random() < 0.5);

  if (lastTypeIsCorrect === isCorrectPair) {
    consecutiveCount++;
  } else {
    lastTypeIsCorrect = isCorrectPair;
    consecutiveCount = 1;
  }

  const questionContent = getRandomSpeechCountry(targetCountry.code, isCorrectPair);

  currentQuestion = {
    target: targetCountry,
    isCorrect: isCorrectPair,
    speechText: questionContent.country + "、" + questionContent.capital,
    enText: questionContent.enText,
    emoji: questionContent.emoji
  };

  flagImg.src = "https://flagcdn.com/w320/" + targetCountry.code + ".png";
  symbolEmoji.innerText = currentQuestion.emoji;
  englishText.innerText = currentQuestion.enText;

  speakText(currentQuestion.speechText);
}

function speakText(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel(); 
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ja-JP';
  utter.rate = 1.0;
  window.speechSynthesis.speak(utter);
}

function checkAnswer(userChoice) {
  if (!isAnswerable) return;
  setButtonsEnabled(false); 

  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel(); 
  }

  const isUserRight = (userChoice === currentQuestion.isCorrect);
  if (isUserRight) {
    statusText.innerText = "⭕ せいかい！";
    playSound('correct');
  } else {
    statusText.innerText = "❌ ざんねん！";
    playSound('wrong');
  }
  setTimeout(nextQuestion, 800); 
}
</script>
</body>
</html>
