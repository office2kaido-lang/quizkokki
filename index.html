<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>せかいの こっき と しゅと クイズ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      font-family: "M PLUS Rounded 1c", sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 850px;
      background: white;
      display: flex;
      flex-direction: column;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
    }
    header {
      background: #3b82f6;
      color: white;
      text-align: center;
      padding: 12px;
      font-size: 20px;
      font-weight: bold;
    }
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #a5f3fc, #0284c7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
      padding: 20px;
      color: white;
    }
    .cover-title {
      font-size: 26px;
      font-weight: 900;
      text-shadow: 2px 2px 0 #0369a1;
      text-align: center;
      line-height: 1.3;
    }
    .btn-go {
      background: #facc15;
      color: #713f12;
      font-size: 52px;
      font-weight: 900;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 6px solid #fff;
      box-shadow: 0 8px 0 #ca8a04;
      cursor: pointer;
    }
    #quiz-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
    }
    .flag-card {
      width: 100%;
      flex: 1;
      max-height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      border: 3px solid #e2e8f0;
      border-radius: 12px;
      padding: 8px;
    }
    .flag-card img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .symbol-box {
      font-size: 80px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .english-box {
      font-size: 20px;
      font-weight: 800;
      color: #1e3a8a;
      background: #e0f2fe;
      border: 2px solid #bae6fd;
      padding: 6px 16px;
      border-radius: 30px;
      text-align: center;
    }
    .status-box {
      font-size: 16px;
      font-weight: bold;
      color: #475569;
      height: 28px;
    }
    .button-group {
      width: 100%;
      display: flex;
      gap: 16px;
      margin: 6px 0;
    }
    .btn-ans {
      flex: 1;
      height: 110px;
      border: none;
      border-radius: 20px;
      font-size: 68px;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }
    .btn-maru {
      background: #22c55e;
      box-shadow: 0 8px 0 #15803d;
    }
    .btn-batsu {
      background: #ef4444;
      box-shadow: 0 8px 0 #b91c1c;
    }
    #line-notice {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      color: white;
      z-index: 200;
      padding: 30px;
      text-align: center;
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div id="app-container">
  <div id="line-notice">
    ⚠️ 音を鳴らすため、画面右上の「…」を押して「Safari（またはChrome）で開く」を選んでね！
  </div>

  <header>こっき・しゅと クイズ</header>

  <div id="start-screen">
    <h1 class="cover-title">せかいの こっき<br>＆ しゅと クイズ</h1>
    <button class="btn-go" onclick="startGame()">GO</button>
  </div>

  <div id="quiz-screen">
    <div class="flag-card"><img id="flag-img" src="" alt="国旗"></div>
    <div class="symbol-box" id="symbol-emoji">🌸</div>
    <div class="english-box" id="english-text">Japan / Tokyo</div>
    <div class="status-box" id="status-text">🔊 よくきいてね！</div>
    <div class="button-group">
      <button class="btn-ans btn-maru" onclick="checkAnswer(true)">〇</button>
      <button class="btn-ans btn-batsu" onclick="checkAnswer(false)">✕</button>
    </div>
  </div>
</div>

<script>
if (navigator.userAgent.indexOf('LINE') !== -1) {
  document.getElementById('line-notice').style.display = 'block';
}

const countries = [
  { code: "jp", country: "日本", capital: "東京", enText: "Japan / Tokyo", emoji: "🌸" },
  { code: "us", country: "アメリカ", capital: "ワシントン", enText: "USA / Washington", emoji: "🗽" },
  { code: "fr", country: "フランス", capital: "パリ", enText: "France / Paris", emoji: "🗼" },
  { code: "gb", country: "イギリス", capital: "ロンドン", enText: "UK / London", emoji: "👑" },
  { code: "de", country: "ドイツ", capital: "ベルリン", enText: "Germany / Berlin", emoji: "🏰" },
  { code: "it", country: "イタリア", capital: "ローマ", enText: "Italy / Rome", emoji: "🍕" },
  { code: "cn", country: "中国", capital: "北京", enText: "China / Beijing", emoji: "🐼" },
  { code: "kr", country: "韓国", capital: "ソウル", enText: "South Korea / Seoul", emoji: "🍱" },
  { code: "ca", country: "カナダ", capital: "オタワ", enText: "Canada / Ottawa", emoji: "🍁" },
  { code: "au", country: "オーストラリア", capital: "キャンベラ", enText: "Australia / Canberra", emoji: "🐨" },
  { code: "br", country: "ブラジル", capital: "ブラジリア", enText: "Brazil / Brasilia", emoji: "⚽" },
  { code: "eg", country: "エジプト", capital: "カイロ", enText: "Egypt / Cairo", emoji: "🐪" },
  { code: "in", country: "インド", capital: "ニューデリー", enText: "India / New Delhi", emoji: "🐘" },
  { code: "es", country: "スペイン", capital: "マドリード", enText: "Spain / Madrid", emoji: "💃" },
  { code: "sg", country: "シンガポール", capital: "シンガポール", enText: "Singapore / Singapore", emoji: "🦁" },
  { code: "th", country: "タイ", capital: "バンコク", enText: "Thailand / Bangkok", emoji: "🐘" },
  { code: "vn", country: "ベトナム", capital: "ハノイ", enText: "Vietnam / Hanoi", emoji: "🍜" },
  { code: "mx", country: "メキシコ", capital: "メキシコシティ", enText: "Mexico / Mexico City", emoji: "🌮" },
  { code: "ru", country: "ロシア", capital: "モスクワ", enText: "Russia / Moscow", emoji: "🪆" },
  { code: "za", country: "南アフリカ", capital: "プレトリア", enText: "South Africa / Pretoria", emoji: "🦁" }
];

let recentFlagHistory = [];
let recentSpeechHistory = [];
let consecutiveCount = 0;
let lastTypeIsCorrect = null;
let currentQuestion = null;
let isAnswerable = false;
let audioCtx = null;

function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880.00, now);
      osc.frequency.setValueAtTime(1174.66, now + 0.12);
      gain.gain.setValueAtTime(1.0, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
      osc.start(now);
      osc.stop(now + 0.6);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.setValueAtTime(140, now + 0.15);
      gain.gain.setValueAtTime(1.0, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
      osc.start(now);
      osc.stop(now + 0.6);
    }
  } catch(e) {}
}

function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  nextQuestion();
}

function getRandomFlagCountry() {
  let available = countries.filter(c => !recentFlagHistory.includes(c.code));
  if (available.length === 0) available = countries;
  const selected = available[Math.floor(Math.random() * available.length)];
  recentFlagHistory.push(selected.code);
  if (recentFlagHistory.length > 10) recentFlagHistory.shift();
  return selected;
}

function getRandomSpeechCountry(targetCode, isCorrectPair) {
  if (isCorrectPair) {
    recentSpeechHistory.push(targetCode);
    if (recentSpeechHistory.length > 10) recentSpeechHistory.shift();
    return countries.find(c => c.code === targetCode);
  } else {
    let available = countries.filter(c => c.code !== targetCode && !recentSpeechHistory.includes(c.code));
    if (available.length === 0) available = countries.filter(c => c.code !== targetCode);
    const selected = available[Math.floor(Math.random() * available.length)];
    recentSpeechHistory.push(selected.code);
    if (recentSpeechHistory.length > 10) recentSpeechHistory.shift();
    return selected;
  }
}

function nextQuestion() {
  isAnswerable = false;
  document.getElementById('status-text').innerText = "🔊 きいてね…";

  const targetCountry = getRandomFlagCountry();
  let isCorrectPair = (consecutiveCount >= 3) ? !lastTypeIsCorrect : (Math.random() < 0.5);

  if (lastTypeIsCorrect === isCorrectPair) {
    consecutiveCount++;
  } else {
    lastTypeIsCorrect = isCorrectPair;
    consecutiveCount = 1;
  }

  const speechCountry = getRandomSpeechCountry(targetCountry.code, isCorrectPair);

  currentQuestion = {
    target: targetCountry,
    isCorrect: isCorrectPair,
    speechText: speechCountry.country + "、" + speechCountry.capital,
    enText: speechCountry.enText
  };

  document.getElementById('flag-img').src = "https://flagcdn.com/w320/" + targetCountry.code + ".png";
  document.getElementById('symbol-emoji').innerText = targetCountry.emoji;
  document.getElementById('english-text').innerText = currentQuestion.enText;

  speakText(currentQuestion.speechText);
  
  setTimeout(function() {
    isAnswerable = true;
    document.getElementById('status-text').innerText = "👉 〇 か ✕ を おしてね！";
  }, 300);
}

function speakText(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ja-JP';
  utter.rate = 1.0;
  window.speechSynthesis.speak(utter);
}

function checkAnswer(userChoice) {
  if (!isAnswerable) return;
  isAnswerable = false;

  const isUserRight = (userChoice === currentQuestion.isCorrect);
  if (isUserRight) {
    document.getElementById('status-text').innerText = "⭕ せいかい！";
    playSound('correct');
  } else {
    document.getElementById('status-text').innerText = "❌ ざんねん！";
    playSound('wrong');
  }
  setTimeout(nextQuestion, 800);
}
</script>
</body>
</html>
