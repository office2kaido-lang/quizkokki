<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>せかいの こっき と しゅと クイズ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 850px;
      background: white;
      display: flex;
      flex-direction: column;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
    }
    header {
      background: #3b82f6;
      color: white;
      text-align: center;
      padding: 12px;
      font-size: 20px;
      font-weight: bold;
    }
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #a5f3fc, #0284c7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
      padding: 20px;
      color: white;
    }
    .cover-title {
      font-size: 26px;
      font-weight: 900;
      text-shadow: 2px 2px 0 #0369a1;
      text-align: center;
      line-height: 1.3;
    }
    .diff-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .diff-title {
      font-size: 16px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.2);
      padding: 4px 16px;
      border-radius: 20px;
    }
    .diff-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      max-width: 340px;
    }
    .diff-btn {
      background: #ffffff;
      color: #0369a1;
      border: 3px solid transparent;
      padding: 12px 0;
      font-size: 18px;
      font-weight: bold;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      transition: all 0.1s;
    }
    .diff-btn.active {
      background: #facc15;
      color: #713f12;
      border-color: #ffffff;
      transform: scale(1.05);
      box-shadow: 0 6px 12px rgba(0,0,0,0.25);
    }
    .btn-go {
      background: #facc15;
      color: #713f12;
      font-size: 48px;
      font-weight: 900;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 6px solid #fff;
      box-shadow: 0 8px 0 #ca8a04;
      cursor: pointer;
      opacity: 0.5;
      pointer-events: none;
      transition: all 0.2s;
    }
    .btn-go.ready {
      opacity: 1;
      pointer-events: auto;
    }
    .btn-go:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #ca8a04;
    }
    #quiz-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px 16px 20px;
      gap: 8px;
    }
    .flag-card {
      width: 100%;
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      border: 3px solid #e2e8f0;
      border-radius: 12px;
      padding: 6px;
    }
    .flag-card img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .symbol-box {
      font-size: 64px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .english-box {
      font-size: 18px;
      font-weight: 800;
      color: #1e3a8a;
      background: #e0f2fe;
      border: 2px solid #bae6fd;
      padding: 4px 14px;
      border-radius: 30px;
      text-align: center;
      min-height: 32px;
    }
    .button-group {
      width: 100%;
      display: flex;
      gap: 16px;
      margin-top: 10px;
      margin-bottom: 6px;
    }
    .btn-ans {
      flex: 1;
      height: 120px;
      border: none;
      border-radius: 20px;
      font-size: 72px;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }
    .btn-maru {
      background: #22c55e;
      box-shadow: 0 8px 0 #15803d;
    }
    .btn-maru:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #15803d;
    }
    .btn-batsu {
      background: #ef4444;
      box-shadow: 0 8px 0 #b91c1c;
    }
    .btn-batsu:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #b91c1c;
    }
    .status-box {
      font-size: 16px;
      font-weight: bold;
      color: #475569;
      height: 24px;
      margin-top: 4px;
    }
    #line-notice {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      color: white;
      z-index: 200;
      padding: 30px;
      text-align: center;
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div id="app-container">
  <div id="line-notice">
    ⚠️ 音を鳴らすため、画面右上の「…」を押して「Safari（またはChrome）で開く」を選んでね！
  </div>

  <header>こっき・しゅと クイズ</header>

  <div id="start-screen">
    <h1 class="cover-title">せかいの こっき<br>＆ しゅと クイズ</h1>
    
    <div class="diff-container">
      <div class="diff-title">むずかしさを えらんでね</div>
      <div class="diff-grid">
        <button class="diff-btn" onclick="selectDifficulty('easy', this)">かんたん</button>
        <button class="diff-btn" onclick="selectDifficulty('normal', this)">ふつう</button>
        <button class="diff-btn" onclick="selectDifficulty('hard', this)">むずかしい</button>
        <button class="diff-btn" onclick="selectDifficulty('expert', this)">ちょう難問</button>
      </div>
    </div>

    <button id="go-btn" class="btn-go" onclick="startGame()">GO</button>
  </div>

  <div id="quiz-screen">
    <div class="flag-card"><img id="flag-img" src="" alt="国旗"></div>
    <div class="symbol-box" id="symbol-emoji">🌸</div>
    <div class="english-box" id="english-text">Japan / Tokyo</div>

    <div class="button-group">
      <button class="btn-ans btn-maru" onclick="checkAnswer(true)">〇</button>
      <button class="btn-ans btn-batsu" onclick="checkAnswer(false)">✕</button>
    </div>

    <div class="status-box" id="status-text">🔊 よくきいてね！</div>
  </div>
</div>

<script>
if (navigator.userAgent.indexOf('LINE') !== -1) {
  document.getElementById('line-notice').style.display = 'block';
}

const allCountries = [
  // かんたん (10カ国)
  { code: "jp", country: "日本", capital: "東京", enText: "Japan / Tokyo", emoji: "🌸", level: 1 },
  { code: "us", country: "アメリカ", capital: "ワシントン", enText: "USA / Washington", emoji: "🗽", level: 1 },
  { code: "gb", country: "イギリス", capital: "ロンドン", enText: "UK / London", emoji: "👑", level: 1 },
  { code: "fr", country: "フランス", capital: "パリ", enText: "France / Paris", emoji: "🗼", level: 1 },
  { code: "de", country: "ドイツ", capital: "ベルリン", enText: "Germany / Berlin", emoji: "🏰", level: 1 },
  { code: "it", country: "イタリア", capital: "ローマ", enText: "Italy / Rome", emoji: "🍕", level: 1 },
  { code: "cn", country: "中国", capital: "北京", enText: "China / Beijing", emoji: "🐼", level: 1 },
  { code: "kr", country: "韓国", capital: "ソウル", enText: "South Korea / Seoul", emoji: "🍱", level: 1 },
  { code: "ca", country: "カナダ", capital: "オタワ", enText: "Canada / Ottawa", emoji: "🍁", level: 1 },
  { code: "au", country: "オーストラリア", capital: "キャンベラ", enText: "Australia / Canberra", emoji: "🐨", level: 1 },

  // ふつう (追加10カ国)
  { code: "br", country: "ブラジル", capital: "ブラジリア", enText: "Brazil / Brasilia", emoji: "⚽", level: 2 },
  { code: "eg", country: "エジプト", capital: "カイロ", enText: "Egypt / Cairo", emoji: "🐪", level: 2 },
  { code: "in", country: "インド", capital: "ニューデリー", enText: "India / New Delhi", emoji: "🐘", level: 2 },
  { code: "es", country: "スペイン", capital: "マドリード", enText: "Spain / Madrid", emoji: "💃", level: 2 },
  { code: "sg", country: "シンガポール", capital: "シンガポール", enText: "Singapore / Singapore", emoji: "🦁", level: 2 },
  { code: "th", country: "タイ", capital: "バンコク", enText: "Thailand / Bangkok", emoji: "🐘", level: 2 },
  { code: "vn", country: "ベトナム", capital: "ハノイ", enText: "Vietnam / Hanoi", emoji: "🍜", level: 2 },
  { code: "mx", country: "メキシコ", capital: "メキシコシティ", enText: "Mexico / Mexico City", emoji: "🌮", level: 2 },
  { code: "ru", country: "ロシア", capital: "モスクワ", enText: "Russia / Moscow", emoji: "🪆", level: 2 },
  { code: "ar", country: "アルゼンチン", capital: "ブエノスアイレス", enText: "Argentina / Buenos Aires", emoji: "🥩", level: 2 },

  // むずかしい (追加10カ国)
  { code: "za", country: "南アフリカ", capital: "プレトリア", enText: "South Africa / Pretoria", emoji: "🦁", level: 3 },
  { code: "nl", country: "オランダ", capital: "アムステルダム", enText: "Netherlands / Amsterdam", emoji: "🌷", level: 3 },
  { code: "ch", country: "スイス", capital: "ベルン", enText: "Switzerland / Bern", emoji: "🧀", level: 3 },
  { code: "se", country: "スウェーデン", capital: "ストックホルム", enText: "Sweden / Stockholm", emoji: "🌲", level: 3 },
  { code: "gr", country: "ギリシャ", capital: "アテネ", enText: "Greece / Athens", emoji: "🏛️", level: 3 },
  { code: "tr", country: "トルコ", capital: "アンカラ", enText: "Turkey / Ankara", emoji: "🥙", level: 3 },
  { code: "nz", country: "ニュージーランド", capital: "ウェリントン", enText: "New Zealand / Wellington", emoji: "🥝", level: 3 },
  { code: "ph", country: "フィリピン", capital: "マニラ", enText: "Philippines / Manila", emoji: "🥭", level: 3 },
  { code: "id", country: "インドネシア", capital: "ジャカルタ", enText: "Indonesia / Jakarta", emoji: "🏝️", level: 3 },
  { code: "pe", country: "ペルー", capital: "リマ", enText: "Peru / Lima", emoji: "🦙", level: 3 },

  // ちょう難問 (追加10カ国)
  { code: "mn", country: "モンゴル", capital: "ウランバートル", enText: "Mongolia / Ulaanbaatar", emoji: "🐎", level: 4 },
  { code: "ke", country: "ケニア", capital: "ナイロビ", enText: "Kenya / Nairobi", emoji: "🦒", level: 4 },
  { code: "fi", country: "フィンランド", capital: "ヘルシンキ", enText: "Finland / Helsinki", emoji: "🎅", level: 4 },
  { code: "pl", country: "ポーランド", capital: "ワルシャワ", enText: "Poland / Warsaw", emoji: "🥟", level: 4 },
  { code: "pt", country: "ポルトガル", capital: "リスボン", enText: "Portugal / Lisbon", emoji: "⛵", level: 4 },
  { code: "cl", country: "チリ", capital: "サンティアゴ", enText: "Chile / Santiago", emoji: "🏔️", level: 4 },
  { code: "co", country: "コロンビア", capital: "ボゴタ", enText: "Colombia / Bogota", emoji: "☕", level: 4 },
  { code: "my", country: "マレーシア", capital: "クアラルンプール", enText: "Malaysia / Kuala Lumpur", emoji: "🏙️", level: 4 },
  { code: "sa", country: "サウジアラビア", capital: "リヤド", enText: "Saudi Arabia / Riyadh", emoji: "🌴", level: 4 },
  { code: "is", country: "アイスランド", capital: "レイキャビク", enText: "Iceland / Reykjavik", emoji: "🌋", level: 4 }
];

let selectedLevel = null;
let currentCountries = [];
let lastCountryCode = null;
let consecutiveCount = 0;
let lastTypeIsCorrect = null;
let currentQuestion = null;
let isAnswerable = false;
let audioCtx = null;

function selectDifficulty(diff, btn) {
  selectedLevel = diff;
  localStorage.setItem('quiz_kokki_diff', diff);

  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const goBtn = document.getElementById('go-btn');
  goBtn.classList.add('ready');

  let maxLevel = 1;
  if (diff === 'easy') maxLevel = 1;
  else if (diff === 'normal') maxLevel = 2;
  else if (diff === 'hard') maxLevel = 3;
  else if (diff === 'expert') maxLevel = 4;

  currentCountries = allCountries.filter(c => c.level <= maxLevel);
}

// 保存された難易度の復元
window.onload = function() {
  const saved = localStorage.getItem('quiz_kokki_diff');
  if (saved) {
    const btns = document.querySelectorAll('.diff-btn');
    const map = { 'easy': 0, 'normal': 1, 'hard': 2, 'expert': 3 };
    if (btns[map[saved]]) {
      selectDifficulty(saved, btns[map[saved]]);
    }
  }
};

function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880.00, now);
      osc.frequency.setValueAtTime(1174.66, now + 0.12);
      gain.gain.setValueAtTime(1.0, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
      osc.start(now);
      osc.stop(now + 0.6);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.setValueAtTime(140, now + 0.15);
      gain.gain.setValueAtTime(1.0, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
      osc.start(now);
      osc.stop(now + 0.6);
    }
  } catch(e) {}
}

function startGame() {
  if (!selectedLevel) return;
  document.getElementById('start-screen').style.display = 'none';
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  nextQuestion();
}

function getRandomFlagCountry() {
  let available = currentCountries.filter(c => c.code !== lastCountryCode);
  if (available.length === 0) available = currentCountries;
  const selected = available[Math.floor(Math.random() * available.length)];
  lastCountryCode = selected.code;
  return selected;
}

function getRandomSpeechCountry(targetCode, isCorrectPair) {
  if (isCorrectPair) {
    return currentCountries.find(c => c.code === targetCode);
  } else {
    let available = currentCountries.filter(c => c.code !== targetCode);
    return available[Math.floor(Math.random() * available.length)];
  }
}

function nextQuestion() {
  isAnswerable = false;
  document.getElementById('status-text').innerText = "🔊 きいてね…";

  const targetCountry = getRandomFlagCountry();
  let isCorrectPair = (consecutiveCount >= 3) ? !lastTypeIsCorrect : (Math.random() < 0.5);

  if (lastTypeIsCorrect === isCorrectPair) {
    consecutiveCount++;
  } else {
    lastTypeIsCorrect = isCorrectPair;
    consecutiveCount = 1;
  }

  const speechCountry = getRandomSpeechCountry(targetCountry.code, isCorrectPair);

  currentQuestion = {
    target: targetCountry,
    isCorrect: isCorrectPair,
    speechText: speechCountry.country + "、" + speechCountry.capital,
    enText: speechCountry.enText
  };

  document.getElementById('flag-img').src = "https://flagcdn.com/w320/" + targetCountry.code + ".png";
  document.getElementById('symbol-emoji').innerText = targetCountry.emoji;
  document.getElementById('english-text').innerText = currentQuestion.enText;

  speakText(currentQuestion.speechText);
  
  setTimeout(function() {
    isAnswerable = true;
    document.getElementById('status-text').innerText = "👉 〇 か ✕ を おしてね！";
  }, 300);
}

function speakText(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ja-JP';
  utter.rate = 1.0;
  window.speechSynthesis.speak(utter);
}

function checkAnswer(userChoice) {
  if (!isAnswerable) return;
  isAnswerable = false;

  const isUserRight = (userChoice === currentQuestion.isCorrect);
  if (isUserRight) {
    document.getElementById('status-text').innerText = "⭕ せいかい！";
    playSound('correct');
  } else {
    document.getElementById('status-text').innerText = "❌ ざんねん！";
    playSound('wrong');
  }
  setTimeout(nextQuestion, 800);
}
</script>
</body>
</html>
